name: Gallery catalogue
on:
  schedule:
    - cron: '23 10 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gallery-catalog
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read and validate public FUT.GG catalogue
        run: node gallery/update-catalog.cjs
      - name: Publish immutable content
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          file=$(node -p 'JSON.parse(require("fs").readFileSync(".gallery-manifest-next.json","utf8")).file')
          git add "gallery/fc27/$file"
          if ! git diff --cached --quiet; then
            git commit -m 'gallery: refresh public catalogue content'
            git push origin HEAD:main
          fi
      - name: Verify public content before switching the manifest
        run: node gallery/update-catalog.cjs --verify-content
      - name: Publish manifest
        run: |
          mv .gallery-manifest-next.json gallery/fc27/manifest.json
          git add gallery/fc27/manifest.json
          if ! git diff --cached --quiet; then
            git commit -m 'gallery: record source check'
            git push origin HEAD:main
          fi
      - name: Verify public manifest
        run: node gallery/update-catalog.cjs --verify-manifest
